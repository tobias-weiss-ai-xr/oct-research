# Curated concept seeds for THIS research corpus.
#
# OCT-specific knowledge base: the "selective" extraction mode
# (config/extraction.yaml) builds the concept graph from these seeds +
# the taxonomy categories, so this file IS the curated knowledge layer.
#
# Grouped by domain; every term must appear verbatim in a paper's
# title/abstract to match (whitespace-tolerant, case-insensitive).
# Concentrated on the laser-welding / inline-process-monitoring cluster
# (Fraunhofer IFSW, TRUMPF/Precitec, inline coherent imaging) that this
# corpus was expanded for, plus the OCT backbone and clinical/DL branches.
