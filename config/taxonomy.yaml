# ⚙️ Research Taxonomy & Discovery Config
#
# Optical Coherence Tomography (OCT) — non-invasive optical cross-sectional
# imaging (low-coherence interferometry). Clinical standard in ophthalmology,
# plus cardiology, dermatology, gastroenterology, neurology, materials science.
#
# Pipeline:  config/taxonomy.yaml → papers.yaml → validate → README → reports

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Optical Coherence Tomography (OCT)"
  short: "oct"
  description: >-
    Datengetriebenes Literaturkorpus zur optischen Kohärenztomographie (OCT):
    Grundlagen und Technikvarianten (SD-OCT, SS-OCT, OCTA, PS-OCT), klinische
    Anwendungen (Ophthalmologie, Kardiologie, Dermatologie, Gastroenterologie,
    Neuro/HNO), KI-gestützte Bildanalyse sowie Evaluations- und Übersichtsarbeiten.
  openalex_mailto: "research@oct.example.org"

# ── Taxonomy ─────────────────────────────────────────────────────────────────
# Categories = main axis (type of work). Subcategories = second axis
# (technique variant for methods, clinical domain for applications).
taxonomy:
  categories:
    - id: method
      display: "Methoden & Technikvarianten"
    - id: application
      display: "Klinische & technische Anwendungen"
    - id: evaluation
      display: "Evaluation, Datensätze & Benchmarks"
    - id: survey
      display: "Surveys & Übersichtsarbeiten"
  subcategories:
    - id: fundamentals
      display: "Grundlagen & Interferometrie"
    - id: sd-oct
      display: "Spektraldomänen-OCT (SD-OCT)"
    - id: ss-oct
      display: "Swept-Source-OCT (SS-OCT)"
    - id: octa
      display: "OCT-Angiographie (OCTA)"
    - id: ps-oct
      display: "Polarisations-sensitive OCT (PS-OCT)"
    - id: ff-oct
      display: "Full-Field & hochauflösendes OCT"
    - id: dl
      display: "Deep Learning & KI-Bildanalyse"
    - id: ophthal
      display: "Ophthalmologie"
    - id: cardio
      display: "Kardiologie"
    - id: derm
      display: "Dermatologie"
    - id: gi
      display: "Gastroenterologie"
    - id: neuro
      display: "Neuro & HNO"
    - id: other
      display: "Weitere Anwendungen"
    - id: dataset
      display: "Datensätze & Benchmarks"
    - id: review
      display: "Übersichtsarbeiten"

# ── Discovery: arXiv queries (fetch_new_papers.py / saturate_papers.py) ───────
arxiv_queries:
  - query: 'abs:"optical coherence tomography"'
    category: method
  - query: 'abs:"OCT angiography"'
    category: method
    subcategory_hint: octa
  - query: 'abs:"swept-source optical coherence tomography" OR abs:"spectral-domain OCT"'
    category: method
  - query: 'abs:"intravascular optical coherence tomography" OR abs:"coronary OCT"'
    category: application
    subcategory_hint: cardio
  - query: 'abs:"optical coherence tomography" AND abs:"deep learning"'
    category: method
    subcategory_hint: dl

# ── Discovery: OpenAlex queries (fetch_openalex_bulk.py) ─────────────────────
openalex_queries:
  - category: method
    query: "optical coherence tomography"
  - category: application
    query: "OCT angiography"
  - category: application
    query: "optical coherence tomography retina"
  - category: application
    query: "optical coherence tomography cardiology coronary"

# ── Trend analysis keywords ──────────────────────────────────────────────────
trend_keywords:
  - "deep learning"
  - "segmentation"
  - "classification"
  - "angiography"
  - "swept-source"
  - "spectral-domain"
  - "retina"
  - "glaucoma"
  - "macular degeneration"
  - "coronary"
  - "plaque"
  - "dermatology"
  - "polarization"
  - "denoising"
  - "foundation model"
  - "benchmark"
  - "dataset"
  - "survey"

# ── Auto-classification keyword rules (subcategory_keywords) ─────────────────
subcategory_keywords:
  - id: fundamentals
    keywords: [interferometr, low-coherence, coherence length, "fourier domain", phase]
  - id: octa
    keywords: ["oct angiography", "octa", "angiograph", "vessel", "microvascular"]
  - id: ss-oct
    keywords: ["swept-source", "swept source"]
  - id: sd-oct
    keywords: ["spectral-domain", "spectral domain", "sd-oct", "spectrometer"]
  - id: ps-oct
    keywords: ["polarization-sensitive", "polarization sensitive", "ps-oct", "birefringence"]
  - id: ff-oct
    keywords: ["full-field", "full field", "en face", "visible-light", "visible light"]
  - id: dl
    keywords: ["deep learning", "neural network", "deep neural", "cnn", "transformer",
               "self-supervised", "segmentation", "classification", "denois", "foundation model"]
  - id: ophthal
    keywords: [retina, macular, glaucoma, cornea, "optic nerve", choroid, vitreous, "age-related"]
  - id: cardio
    keywords: ["intravascular", coronary, "fibrous cap", plaque, "stent", "atrial", "cardiac"]
  - id: derm
    keywords: [dermat, skin, cutaneous, wound, melanoma, "basal cell"]
  - id: gi
    keywords: [gastroentero, esophag, "barrett", colon, "endoscopic"]
  - id: neuro
    keywords: [brain, neurosur, cerebral, cortex, cochlea, larynx, "multiple sclerosis", alzheimer]
  - id: other
    keywords: [dental, tooth, enamel, cancer, "non-destructive", "cultural heritage", art, materials, "wood"]
  - id: review
    keywords: [review, survey, overview, "state of the art", "milestone", meta-analysis]
