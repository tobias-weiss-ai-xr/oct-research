- title: Optical coherence tomography - principles and applications
  date: 2003-01
  url: https://doi.org/10.1088/0034-4885/66/2/204
  category: survey
  subcategory: review
  authors:
  - Adolf F. Fercher
  - Wolfgang Drexler
  - Christoph K. Hitzenberger
  - Theo Lasser
  venue: Reports on Progress in Physics
  abstract: 'There have been three basic approaches to optical tomography since the early 1980s: diffraction
    tomography, diffuse optical tomography and optical coherence tomography (OCT). Optical techniques
    are of particular importance in the medical field, because these techniques promise to be safe and
    cheap and, in addition, offer a therapeutic potential. Advances in OCT technology have made it possible
    to apply OCT in a wide variety of applications but medical applications are still dominating. Specific
    advantages of OCT are its high depth and transversal resolution, the fact, that its depth resolution
    is decoupled from transverse resolution, high probing depth in scattering media, contact-free and
    non-invasive operation, and the possibility to create various function dependent image contrasting
    methods. This report presents the principles of OCT and the state of important OCT applications. OCT
    synthesises cross-sectional images from a series of laterally adjacent depth-scans. At present OCT
    is used in three different fields of optical imaging, in macroscopic imaging of structures which can
    be seen by the naked eye or using weak magnifications, in microscopic imaging using magnifications
    up'
- title: Optical coherence tomography angiography
  date: 2017-12
  url: https://doi.org/10.1016/j.preteyeres.2017.11.003
  category: survey
  subcategory: review
  authors:
  - Richard F. Spaide
  - James G. Fujimoto
  - Nadia K. Waheed
  - Srinivas R. Sadda
  - Giovanni Staurenghi
  venue: Progress in Retinal and Eye Research
  abstract: Optical coherence tomography (OCT) was one of the biggest advances in ophthalmic imaging.
    Building on that platform, OCT angiography (OCTA) provides depth resolved images of blood flow in
    the retina and choroid with levels of detail far exceeding that obtained with older forms of imaging.
    This new modality is challenging because of the need for new equipment and processing techniques,
    current limitations of imaging capability, and rapid advancements in both imaging and in our understanding
    of the imaging and applicable pathophysiology of the retina and choroid. These factors lead to a steep
    learning curve, even for those with a working understanding dye-based ocular angiography. All for
    a method of imaging that is a little more than 10 years old. This review begins with a historical
    account of the development of OCTA, and the methods used in OCTA, including signal processing, image
    generation, and display techniques. This forms the basis to understand what OCTA images show as well
    as how image artifacts arise. The anatomy and imaging of specific vascular layers of the eye are reviewed.
