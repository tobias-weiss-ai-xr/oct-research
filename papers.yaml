- title: Optical Coherence Tomography
  date: 1991-11
  url: https://doi.org/10.1126/science.1957169
  category: method
  subcategory: fundamentals
  authors:
  - David Huang
  - Eric A. Swanson
  - Charles P. Lin
  - Joel S. Schuman
  - William G. Stinson
  - Warren Chang
  - Michael R. Hee
  - Thomas Flotte
  venue: Science
  abstract: A technique called optical coherence tomography (OCT) has been developed for noninvasive cross-sectional
    imaging in biological systems. OCT uses low-coherence interferometry to produce a two-dimensional
    image of optical scattering from internal tissue microstructures in a way that is analogous to ultrasonic
    pulse-echo imaging. OCT has longitudinal and lateral spatial resolutions of a few micrometers and
    can detect reflected signals as small as approximately 10(-10) of the incident optical power. Tomographic
    imaging is demonstrated in vitro in the peripapillary area of the retina and in the coronary artery,
    two clinically relevant examples that are representative of transparent and turbid media, respectively.
- title: Sensitivity advantage of swept source and Fourier domain optical coherence tomography
  date: 2003-09
  url: https://doi.org/10.1364/OE.11.002183
  category: method
  subcategory: sd-oct
  authors:
  - Michael A. Choma
  - Marinko V. Šarunic
  - Changhuei Yang
  - Joseph A. Izatt
  venue: Optics Express
  abstract: 'We present theoretical and experimental results which demonstrate the superior sensitivity
    of swept source (SS) and Fourier domain (FD) optical coherence tomography (OCT) techniques over the
    conventional time domain (TD) approach. We show that SS- and FD-OCT have equivalent expressions for
    system signal-to-noise ratio which result in a typical sensitivity advantage of 20-30dB over TD-OCT.
    Experimental verification is provided using two novel spectral discrimination (SD) OCT systems: a
    differential fiber-based 800nm FD-OCT system which employs deep-well photodiode arrays, and a differential
    1300nm SS-OCT system based on a swept laser with an 87nm tuning range.'
