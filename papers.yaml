- title: 3D Polymer Weld Seam Characterization Based on Optical Coherence Tomography for Laser Transmission Welding Applications
  date: 2014-01
  url: https://doi.org/10.1016/j.phpro.2014.08.055
  category: application
  subcategory: other
  authors:
  - Robert Schmitt
  - Guilherme Mallmann
  - M. Devrient
  - Michael Schmidt
  venue: Physics Procedia
  abstract: Laser transmission welding is an established single-stage plastic joining process, which enables hermetically
    sealed joints under the workpiece surface. The process requires joining partners with proper degrees of transmission and
    absorption to the processing wavelength. For reaching a stable process an in-process quality assurance is very valuable.
    Current monitoring systems have a limited usage, as no quantitative information of the weld itself is obtained without
    its destruction. In medical and pharmaceutical applications a weld with leakage is e.g. unacceptable. The main objective
    of this paper is the presentation of the optical coherence tomography as a tool for the quality assurance in laser transmission
    welding. This approach enables the measurement of any residual gap, weld geometry, internal pores and leaks. The presented
    results show that this technique allows even the characterization of welds using joining partners with thicknesses of
    2 mm or with glass fiber reinforcement levels of 30% per weight.
- title: Automatic laser welding and milling with in situ inline coherent imaging
  date: 2014-10
  url: https://doi.org/10.1364/ol.39.006217
  category: application
  subcategory: other
  authors:
  - Paul J. L. Webster
  - Logan G. Wright
  - Y. Ji
  - Christopher M. Galbraith
  - A. W. Kinross
  - C. Van Vlack
  - James M. Fräser
  venue: Optics Letters
  abstract: Although new affordable high-power laser technologies enable many processing applications in science and industry,
    depth control remains a serious technical challenge. In this Letter we show that inline coherent imaging (ICI), with line
    rates up to 312 kHz and microsecond-duration capture times, is capable of directly measuring laser penetration depth,
    in a process as violent as kW-class keyhole welding. We exploit ICI's high speed, high dynamic range, and robustness to
    interference from other optical sources to achieve automatic, adaptive control of laser welding, as well as ablation,
    achieving 3D micron-scale sculpting in vastly different heterogeneous biological materials.
- title: Non-Destructive Identification of Weld-Boundary and Porosity Formation During Laser Transmission Welding by Using
    Optical Coherence Tomography
  date: 2018-01
  url: https://doi.org/10.1109/access.2018.2882527
  category: application
  subcategory: other
  authors:
  - Kanghae Kim
  - Pilun Kim
  - Jaeyul Lee
  - Suwon Kim
  - Sungjo Park
  - Soo Ho Choi
  - JunHo Hwang
  - Jong‐Hoon Lee
  - Ho Lee
  - "\uFEFFRuchire Eranga \uFEFFWijesinghe"
  - Mansik Jeon
  - Jeehyun Kim
  venue: IEEE Access
  abstract: Laser transmission welding offers significant benefits over conventional welding techniques enabling single-stage
    rapid plastic joining. The quality of laser transmission welded products is commonly assessed by measuring the weld penetration
    depth, hardened weld boundary, and inspecting the formation of porosity. However, the existing methods of verification
    are inevitably accompanied by destruction of the specimen. Thus, non-destructive quality assessment methods for laser
    transmission welding have gained attention recently. Here, we demonstrated an extended industrial application of 860 nm
    wavelength-based spectral domain optical coherence tomography for the non-destructive inspection of the aforementioned
    quality parameters of laser transmission welded industrial plastic materials, i.e., polycarbonate and acrylonitrile butadiene
    styrene copolymer. The acquired cross-sectional resolution and volumetric and intensity profiles sufficiently contributed
    to the quality assessment procedure, revealing the weld boundary and porosity formation, and thus confirming the potential
    applicability of optical coherence tomography for the quality inspection of laser transmission welded products.
- title: Statistical evaluation method to determine the laser welding depth by optical coherence tomography
  date: 2019-03
  url: https://doi.org/10.1016/j.optlaseng.2019.03.014
  category: application
  subcategory: other
  authors:
  - Meiko Boley
  - Florian Fetzer
  - Rudolf Weber
  - Thomas Graf
  venue: Optics and Lasers in Engineering
  abstract: Abstract A statistical filtering method to determine the depth of laser-welded seams from signals recorded by
    means of optical coherence tomography (OCT) is proposed and discussed. The measured data points are initially classified
    into noise and significant data by means of a noise probability, which was defined based on the normalized Poisson distribution.
    A percentile filter is then applied to the significant data to obtain the depth of the weld seam. It is shown that the
    depth determined by this approach corresponds to the real seam depth, as obtained from longitudinal sections, to within
    an average error of less than 5%. The method can be applied to different laser welding situations without having to adjust
    the filter parameters.
