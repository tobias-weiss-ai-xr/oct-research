  abstract: Artificial Intelligence (AI) has long promised to increase healthcare affordability, quality
    and accessibility but FDA, until recently, had never authorized an autonomous AI diagnostic system.
    This pivotal trial of an AI system to detect diabetic retinopathy (DR) in people with diabetes enrolled
    900 subjects, with no history of DR at primary care clinics, by comparing to Wisconsin Fundus Photograph
    Reading Center (FPRC) widefield stereoscopic photography and macular Optical Coherence Tomography
    (OCT), by FPRC certified photographers, and FPRC grading of Early Treatment Diabetic Retinopathy Study
    Severity Scale (ETDRS) and Diabetic Macular Edema (DME). More than mild DR (mtmDR) was defined as
    ETDRS level 35 or higher, and/or DME, in at least one eye. AI system operators underwent a standardized
    training protocol before study start. Median age was 59 years (range, 22-84 years); among participants,
    47.5% of participants were male; 16.1% were Hispanic, 83.3% not Hispanic; 28.6% African American and
